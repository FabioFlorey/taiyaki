[package]
name = "taiyaki"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
