[package]
name = "taiyaki"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rand = "0.9"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "io-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
